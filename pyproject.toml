[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tiny-transformer-lab"
version = "0.1.0"
description = "A single-GPU Transformer learning lab with replaceable CUDA/CuTe operators"
requires-python = ">=3.9"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
data = ["datasets>=3,<5", "tokenizers>=0.21,<1", "huggingface-hub>=0.30,<2"]

[tool.setuptools.packages.find]
include = ["tiny_transformer*"]
