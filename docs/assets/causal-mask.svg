   <g id="text_49">
    <text style="fill: #172554; font: 11px 'DejaVu Sans'" transform="translate(351.18 216.240812)">Single-token decode sees every cached key.</text>
    <text style="fill: #172554; font: 11px 'DejaVu Sans'" transform="translate(351.18 228.558406)">A naive non-square triangular mask is wrong.</text>
    <text style="fill: #172554; font: 11px 'DejaVu Sans'" transform="translate(351.18 240.876)">Isolated packing also requires same document ID.</text>
